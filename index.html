<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#162c49" />
  <meta name="description" content="Budżet domowy – Dom przy Wiśniowa 9" />
  <title>Budżet domowy – Dom przy Wiśniowa 9</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell" id="app">
    <section class="home-screen" id="homeScreen" aria-label="Ekran główny">
      <nav class="main-actions" aria-label="Menu główne">
        <button class="menu-btn" data-view="expenses" aria-label="Wydatki">
          <span class="menu-icon" aria-hidden="true">▣</span>
          <span class="menu-label">Wydatki</span>
          <span class="menu-arrow" aria-hidden="true">›</span>
        </button>
        <button class="menu-btn" data-view="history" aria-label="Historia">
          <span class="menu-icon" aria-hidden="true">◷</span>
          <span class="menu-label">Historia</span>
          <span class="menu-arrow" aria-hidden="true">›</span>
        </button>
        <button class="menu-btn" data-view="reports" aria-label="Raporty">
          <span class="menu-icon" aria-hidden="true">▥</span>
          <span class="menu-label">Raporty</span>
          <span class="menu-arrow" aria-hidden="true">›</span>
        </button>
        <button class="menu-btn" data-view="gallery" aria-label="Galeria">
          <span class="menu-icon" aria-hidden="true">▧</span>
          <span class="menu-label">Galeria</span>
          <span class="menu-arrow" aria-hidden="true">›</span>
        </button>
        <button class="menu-btn exit" id="exitBtn" aria-label="Koniec">
          <span class="menu-icon" aria-hidden="true">⏻</span>
          <span class="menu-label">Koniec</span>
          <span class="menu-arrow" aria-hidden="true">›</span>
        </button>
      </nav>
      <div class="version">v1013</div>
    </section>

    <section class="content-screen" id="contentScreen" hidden>
      <header class="content-header">
        <button class="back-btn" id="backBtn" aria-label="Wróć">←</button>
        <div>
          <h2 id="contentTitle">Wydatki</h2>
          <p id="contentSubtitle">Dodaj nowy wydatek</p>
        </div>
      </header>

      <form class="expense-card" id="expenseForm" hidden>
        <div class="form-row">
          <label class="field field-amount">
            <span>Kwota</span>
            <div class="amount-box">
              <input id="amountInput" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" required />
              <strong>zł</strong>
            </div>
          </label>

          <label class="field">
            <span>Rodzaj wydatku</span>
            <select id="categoryInput" name="category" required>
              <option value="" selected disabled>Wybierz kategorię</option>
              <option>Żywność</option>
              <option>Rachunki i media</option>
              <option>Dom i wyposażenie</option>
              <option>Chemia i higiena</option>
              <option>Transport</option>
              <option>Zdrowie</option>
              <option>Ubrania</option>
              <option>Rozrywka</option>
              <option>Inne</option>
            </select>
          </label>
        </div>

        <div class="form-row">
          <label class="field">
            <span>Data</span>
            <input id="dateInput" name="date" type="date" required />
          </label>

          <div class="field receipt-field">
            <span>Paragon</span>
            <label class="receipt-btn" for="receiptInput">
              <span class="camera-icon">📷</span>
              <span>Zrób / dodaj zdjęcie</span>
            </label>
            <input id="receiptInput" type="file" accept="image/*" capture="environment" hidden />
          </div>
        </div>

        <div class="receipt-preview" id="receiptPreview" hidden>
          <img id="receiptImage" alt="Podgląd paragonu" />
          <div>
            <strong>Paragon gotowy do zapisania</strong>
            <span id="receiptName"></span>
          </div>
          <button type="button" class="remove-receipt" id="removeReceiptBtn" aria-label="Usuń zdjęcie">×</button>
        </div>

        <p class="archive-note">Zdjęcie paragonu zostanie zapisane razem z wydatkiem w lokalnym archiwum aplikacji.</p>

        <div class="form-actions">
          <button class="action-btn save" type="submit">Dodaj</button>
          <button class="action-btn cancel" type="button" id="cancelExpenseBtn">Anuluj</button>
        </div>
      </form>

      <section class="gallery-card" id="galleryCard" hidden>
        <div class="gallery-toolbar">
          <label class="field gallery-date-field">
            <span>Data folderu</span>
            <input id="galleryDateInput" type="date" />
          </label>

          <div class="gallery-add-actions">
            <label class="gallery-action-btn" for="galleryCameraInput">
              <span>📷</span><strong>Zrób zdjęcie</strong>
            </label>
            <input id="galleryCameraInput" type="file" accept="image/*" capture="environment" hidden />

            <label class="gallery-action-btn" for="galleryFileInput">
              <span>🖼️</span><strong>Dodaj zdjęcie</strong>
            </label>
            <input id="galleryFileInput" type="file" accept="image/*" multiple hidden />
          </div>
        </div>

        <div class="gallery-folders" id="galleryFolders">
          <div class="gallery-empty" id="galleryEmpty">
            <div>📁</div>
            <strong>Galeria jest pusta</strong>
            <span>Zrób pierwsze zdjęcie lub dodaj je z urządzenia.</span>
          </div>
        </div>
      </section>

      <div class="placeholder-card" id="placeholderCard" hidden>
        <div class="placeholder-icon">🏠</div>
        <h3 id="placeholderTitle">Historia</h3>
        <p id="placeholderText">Ten moduł przygotujemy w kolejnym kroku.</p>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
